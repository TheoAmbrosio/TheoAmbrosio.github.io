<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url | default: '/' }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Theo Ambrósio">
  <meta property="og:title" content="{{ page.title | escape }} · {{ site.data.profile.navbar_name }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | default: '/' }}">
  <meta property="og:image" content="{{ site.url }}{{ site.data.profile.portrait_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#f7f5f0">
  <title>{{ page.title | escape }} · {{ site.data.profile.navbar_name }}</title>
  <link rel="icon" href="{{ '/assets/images/avatar-theo.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css" integrity="sha512-P5MgMn1jBN01asBgU0z60Qk4QxiXo86+wlFahKrsQf37c9cro517WzVSPPV1tDKzhku2iJ2FVgL67wG03SGnNA==" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  {% include navbar.html %}
  <main id="conteudo" class="container-lg site-main">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
